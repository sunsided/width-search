[package]
name = "width-search"
description = "Width-based search without heuristics: novelty tables, Iterated Width (IW), hierarchical IW, IHIW, π-HIW, Serialized IW, SIW+, SIW-R with sketches, BFWS, Rollout IW and π-IW for planning and games"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/sunsided/width-search"
homepage = "https://sunsided.github.io/planning-and-search/crates/width-search/"
readme = "README.md"
keywords = ["planning", "width-based-search", "novelty", "iterated-width", "bfws"]
categories = ["algorithms", "artificial-intelligence", "game-development", "science"]
# GPL-2.0-or-later / Apache-2.0 test inputs and the GPL text; see tests/fixtures/README.md
exclude = ["tests/fixtures", "LICENSES/GPL-2.0-or-later.txt"]

[package.metadata.docs.rs]
# The sas adapter is behind a feature; document it too.
all-features = true

[features]
default = []
sas-plus = ["dep:sas-plus"]

[dependencies]
sas-plus = { version = "0.2.1", optional = true }

[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
sas-plus = { version = "0.2.1" }

[[example]]
name = "fd_task"
required-features = ["sas-plus"]

[[bench]]
name = "search"
harness = false
required-features = ["sas-plus"]
