[package]
name = "width-search-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# A separate workspace, kept out of the crate's own.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.width-search]
path = ".."

[[bin]]
name = "novelty"
path = "fuzz_targets/novelty.rs"
test = false
doc = false
bench = false

# Copy of the crate's lint table: a separate workspace does not inherit it.
[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
