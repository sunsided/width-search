[package]
name = "width-search"
description = "Width-based search: novelty tables, Iterated Width (IW), and Best-First Width Search (BFWS)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/sunsided/width-search"
readme = "README.md"

[features]
default = []
sas-plus = ["dep:sas-plus"]

[dependencies]
sas-plus = { version = "0.1.0", optional = true }

[dev-dependencies]
sas-plus = { version = "0.1.0" }

[[test]]
name = "sas_random"
required-features = ["sas-plus"]
